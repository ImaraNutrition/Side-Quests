<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build The Bones You'll Live With — Imara Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Arial&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFFFF;
    --navy: #1B2A4A;
    --ink: #1A1A1A;
    --rule-thin: #444;
    --rule-thick: #1A1A1A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    padding: 0;
  }

  .label-container {
    max-width: 700px;
    margin: 0 auto;
    background: var(--cream);
    border: 3px solid var(--navy);
    padding: 24px 28px 32px;
  }

  /* ---- Title ---- */
  .main-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 800;
    font-size: clamp(20px, 4.2vw, 30px);
    text-align: center;
    margin: 0 0 18px;
    line-height: 1.25;
  }

  .nf-header {
    font-weight: 800;
    font-size: clamp(22px, 5vw, 32px);
    margin: 0 0 12px;
  }

  .thick-rule {
    border: none;
    border-top: 8px solid var(--rule-thick);
    margin: 8px 0 14px;
  }

  .medium-rule {
    border: none;
    border-top: 4px solid var(--rule-thick);
    margin: 14px 0;
  }

  .thin-rule {
    border: none;
    border-top: 1px solid var(--rule-thin);
    margin: 0;
  }

  /* ---- Intro copy ---- */
  .intro {
    font-size: clamp(13px, 2.6vw, 14.5px);
    line-height: 1.55;
    margin-bottom: 4px;
  }

  .intro p { margin: 0 0 10px; }

  /* ---- Daily Value column header ---- */
  .dv-header {
    text-align: right;
    font-weight: 700;
    font-size: clamp(13px, 2.8vw, 15px);
    padding: 6px 0;
  }

  /* ---- Nutrient rows: each row is ONE flex unit, so label/desc/value
         never separate from each other on mobile ---- */
  .nutrient-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
  }

  .nutrient-row.thin-border { border-bottom: 1px solid var(--rule-thin); }
  .nutrient-row.thick-border { border-bottom: 4px solid var(--rule-thick); }

  .nutrient-text {
    flex: 1 1 auto;
    min-width: 0; /* allows text to wrap properly instead of overflowing */
  }

  .nutrient-name {
    font-weight: 700;
    text-decoration: underline;
    font-size: clamp(14px, 3vw, 16px);
  }

  .nutrient-desc {
    font-size: clamp(12.5px, 2.6vw, 14px);
    line-height: 1.5;
  }

  .nutrient-value {
    flex: 0 0 auto;
    font-weight: 700;
    font-size: clamp(15px, 3.4vw, 18px);
    white-space: nowrap;
    padding-top: 2px;
    text-align: right;
  }

  /* On very narrow screens, let the value drop under the text
     but KEEP it inside the same row/card as its own nutrient —
     never separated into a different section of the page. */
  @media (max-width: 380px) {
    .nutrient-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .nutrient-value {
      text-align: left;
      padding-top: 0;
    }
  }

  /* ---- Snacks section ---- */
  .snacks-title {
    font-weight: 800;
    font-size: clamp(15px, 3.2vw, 17px);
    margin: 18px 0 8px;
  }

  .snacks-intro {
    font-size: clamp(13px, 2.6vw, 14.5px);
    margin-bottom: 10px;
  }

  .snacks-list {
    margin: 0;
    padding-left: 20px;
    font-size: clamp(13px, 2.6vw, 14.5px);
    line-height: 1.7;
  }

  .snacks-list li { margin-bottom: 2px; }

  .footnote {
    font-size: clamp(11px, 2.2vw, 12.5px);
    font-style: italic;
    color: #333;
    margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="label-container" id="label-root"></div>

<script>
/* =========================================================
   MONTHLY CONTENT — edit everything below to reuse this
   template for a new topic (e.g. Iron / Blood / Heart Health).
   The layout code above never needs to change.
   ========================================================= */

const content = {
  mainTitle: "Build The Bones You'll Live With For The Rest Of Your Life",
  nfHeader: "Nutrition Facts",

  introParagraphs: [
    "You've probably heard some version of the claim that bone is stronger than steel — pound for pound, it actually is. That's not a random fun fact, though. It's a clue about what bone actually is: not a static skeleton sitting there holding you up, but living tissue, constantly being broken down and rebuilt, doing more engineering work than almost anything else in your body. And right now, during these teen years, you're doing more of that building than you will later in life. You're laying down a huge part of the bone foundation you'll carry into adulthood. So what's actually going into that construction project?",
    
    "Protein forms the flexible scaffold bones are built on, and calcium and phosphorus are the minerals that harden onto that scaffold to give bone its strength. Vitamin D helps your body absorb calcium, vitamin K helps activate proteins involved in bone formation and mineralization, and magnesium helps activate vitamin D and plays a role in bone structure. Iron plays a smaller supporting role too — it helps build collagen and keeps the cells that construct new bone properly supplied with oxygen."
  ],

  dvHeaderLabel: "Daily Value*",

  nutrients: [
    {
      name: "Iron:",
      desc: "Supports collagen production and helps supply oxygen to cells involved in building bone. Girls ages 14–18 need more iron than boys the same age, in part because menstruation increases iron losses.",
      value: "15 mg"
    },
    {
      name: "Calcium:",
      desc: "The main mineral in bone. It helps build and maintain bone strength and density.",
      value: "1,300 mg"
    },
    {
      name: "Vitamin D:",
      desc: "Helps your body absorb calcium and supports normal bone growth and maintenance.",
      value: "600 IU (15 mcg)"
    },
    {
      name: "Magnesium:",
      desc: "Helps activate vitamin D and plays a role in bone structure and mineralization.",
      value: "360 mg"
    },
    {
      name: "Phosphorus:",
      desc: "Works with calcium to build the mineral structure that gives bone its strength.",
      value: "1,250 mg"
    },
    {
      name: "Vitamin K:",
      desc: "Helps activate proteins involved in bone formation and mineralization.",
      value: "75 mcg"
    },
    {
      name: "Protein:",
      desc: "Provides the building blocks for collagen, the flexible framework that gives bone its structure.",
      value: "~46 g"
    }
  ],

  transition: [
    "So what does all of this mean for you?",
    
    "You don't need to memorize the list above or start taking a handful of supplements every morning. Your body is already doing the building. It just needs the raw materials.",
    
    "And this is one of those times when future-you is worth thinking about. Your bones are laying down their foundation now, while you're still growing. Once you reach adulthood, bone building slows, and over the course of your life, bone loss gradually becomes part of the picture.",
    
    "Osteoporosis might sound like a problem for someone else's grandma, not someone who still has homework. But the foundation that helps protect your bones later in life is being built right now.",
    
    "The good news? You don't need a perfect diet. You just need enough of the right building materials, often enough, from food you actually enjoy.",
    
    "So let's make that practical."
  ],

  snacksTitle: "How to Get There:",

  snacksIntro: "You don't need to build every meal around your bones. Just give them some of the right building materials throughout the day.",

  snacks: [
    "<strong>Breakfast: Fortified yogurt + berries + nuts</strong><br>Greek yogurt brings protein, calcium and phosphorus. If it's fortified with vitamin D, it can help with that one too. Add berries and nuts for a little extra variety and magnesium.",
    
    "<strong>Lunch: Chicken or bean quesadilla</strong><br>Whole-grain tortilla, beans or chicken, cheese, and whatever vegetables you like. That's protein, calcium, phosphorus, magnesium and, with beans, a useful hit of iron.",
    
    "<strong>Snack: Apple + peanut butter</strong><br>Not a complete bone-building meal, but an easy way to add some protein and magnesium between meals.",
    
    "<strong>Dinner: Salmon rice bowl</strong><br>Salmon brings protein and vitamin D, while rice and vegetables round things out. Add leafy greens or broccoli for vitamin K and some extra calcium.",
    
    "<strong>The five-minute option</strong><br>Eggs + whole-grain toast + a glass of fortified milk or fortified soy milk. Add a piece of fruit and call it dinner. Seriously."
  ],

  snacksExtra: [
    "<strong>Vitamin D is the tricky one.</strong> There aren't many foods that naturally contain much of it, which is why fortified foods can be useful. Your body can also make vitamin D when your skin is exposed to sunlight. If you live somewhere sunny, spending some time outdoors can contribute to your vitamin D supply. How much vitamin D your skin makes depends on things like the season, time of day, location, skin pigmentation, and how much skin is exposed, so sunshine isn't a one-size-fits-all prescription.",
    
    "And there's one more piece of the puzzle: <strong>use your bones.</strong> Running, jumping, dancing, sports, hiking and resistance training all put healthy stress on your bones and help them get stronger.",
    
    "You don't need a perfect diet or a perfect workout routine. Your bones are looking for consistency, not perfection."
  ],

  cheeseFootnote: "*Cheddar, mozzarella, Swiss, or Parmesan. Processed cheese products may contain calcium, but their nutrition varies by product."
};
/* =========================================================
   RENDER — do not edit below this line
   ========================================================= */

function render(data) {
  const root = document.getElementById('label-root');

  const introHtml = data.introParagraphs
    .map(p => `<p>${p}</p>`)
    .join('');

  const transitionHtml = data.transition
    .map(p => `<p>${p}</p>`)
    .join('');

  const nutrientsHtml = data.nutrients
    .map((n, i) => {
      const isLast = i === data.nutrients.length - 1;
      const borderClass = isLast ? '' : 'thin-border';

      return `
        <div class="nutrient-row ${borderClass}">
          <div class="nutrient-text">
            <span class="nutrient-name">${n.name}</span>
            <span class="nutrient-desc">${n.desc}</span>
          </div>
          <div class="nutrient-value">${n.value}</div>
        </div>
      `;
    })
    .join('');

  const snacksHtml = data.snacks
    .map(s => `<li>${s}</li>`)
    .join('');

  const snacksExtraHtml = data.snacksExtra
    .map(p => `<p>${p}</p>`)
    .join('');

  root.innerHTML = `
    <h1 class="main-title">${data.mainTitle}</h1>
    <h2 class="nf-header">${data.nfHeader}</h2>

    <hr class="thick-rule">

    <div class="intro">
      ${introHtml}
    </div>

    <hr class="medium-rule">

    <div class="dv-header">
      ${data.dvHeaderLabel}
    </div>

    ${nutrientsHtml}

    <hr class="medium-rule">

    <div class="transition">
      ${transitionHtml}
    </div>

    <hr class="medium-rule">

    <div class="snacks-title">
      ${data.snacksTitle}
    </div>

    <div class="snacks-intro">
      ${data.snacksIntro}
    </div>

    <ul class="snacks-list">
      ${snacksHtml}
    </ul>

    <div class="snacks-extra">
      ${snacksExtraHtml}
    </div>

    <div class="footnote">
      ${data.cheeseFootnote}
    </div>
  `;
}

render(content);
</script>

</body>
</html>
