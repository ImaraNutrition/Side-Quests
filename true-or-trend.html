<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True or Trend? — The Group Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #1B3B2F;
    --pine-deep: #142E25;
    --cream: #FAF6EE;
    --gold: #E8A33D;
    --gold-soft: #F2C879;
    --ink: #1F2A24;
    --correct: #4F8A5E;
    --correct-bg: #E4F0E5;
    --incorrect: #9A5A6E;
    --incorrect-bg: #F3E5EA;
    --muted: #6B7B72;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--pine);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(232,163,61,0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(232,163,61,0.06) 0%, transparent 40%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .wrap { width: 100%; max-width: 440px; }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-soft);
    text-align: center;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--cream);
    text-align: center;
    margin: 0 0 4px;
  }

  .sub {
    text-align: center;
    color: rgba(250,246,238,0.7);
    font-size: 14px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .progress-label {
    font-size: 12px;
    font-weight: 600;
    color: rgba(250,246,238,0.6);
    letter-spacing: 0.04em;
  }

  .streak {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(250,246,238,0.15);
    border-radius: 99px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .card {
    background: var(--cream);
    border-radius: 24px;
    padding: 32px 28px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    min-height: 340px;
    display: flex;
    flex-direction: column;
  }

  .claim-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }

  .claim {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 21px;
    text-align: center;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 28px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: auto;
  }

  .btn {
    flex: 1;
    border: 2px solid var(--ink);
    background: transparent;
    border-radius: 14px;
    padding: 16px 12px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:disabled { cursor: default; }

  .btn-true { border-color: var(--correct); }
  .btn-true:hover:not(:disabled) { background: var(--correct-bg); }

  .btn-myth { border-color: var(--incorrect); }
  .btn-myth:hover:not(:disabled) { background: var(--incorrect-bg); }

  .btn.selected-correct { background: var(--correct-bg); border-color: var(--correct); }
  .btn.selected-incorrect { background: var(--incorrect-bg); border-color: var(--incorrect); }
  .btn.reveal-correct { background: var(--correct-bg); border-color: var(--correct); }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--correct-bg); color: #2F5A3B; }
  .feedback.incorrect { background: var(--incorrect-bg); color: #6E3648; }
  .feedback strong { display: block; margin-bottom: 4px; font-family: 'Fredoka', sans-serif; }

  .next-btn {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--pine);
    color: var(--cream);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--pine-deep); }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 18px;
    font-size: 12px;
    color: rgba(250,246,238,0.55);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-true { background: var(--correct); }
  .dot-myth { background: var(--incorrect); }

  .end-screen { text-align: center; }
  .end-emoji { font-size: 52px; margin-bottom: 8px; }
  .kyle-img {
    max-width: 220px;
    width: 60%;
    margin: 0 auto 10px;
    display: block;
  }
  .kyle-caption {
    font-size: 12.5px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .end-title { font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .end-score { font-size: 15px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .restart-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--gold);
    color: var(--pine-deep);
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .restart-btn:hover { background: var(--gold-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">The Group Chat · Mini Game</div>
  <h1>True or Trend?</h1>
  <p class="sub">Your feed is full of confident-sounding claims. Can you tell the real science from the viral myth?</p>

  <div class="progress-row">
    <span class="progress-label" id="progress-label">Claim 1 of 10</span>
    <span class="streak" id="streak-label">🔥 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width: 10%;"></div></div>

  <div class="card" id="game-card">
    <div class="claim-label">Is this claim...</div>
    <div class="claim" id="claim-text">Loading...</div>

    <div class="btn-row" id="btn-row">
      <button class="btn btn-true" id="btn-true" onclick="answer('true')">True</button>
      <button class="btn btn-myth" id="btn-myth" onclick="answer('myth')">Trend (Myth)</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next →</button>
  </div>

  <div class="legend">
    <span><span class="dot dot-true"></span>True = backed by real science</span>
    <span><span class="dot dot-myth"></span>Trend = sounds legit, isn't</span>
  </div>
</div>

<script>
const claims = [
  { text: "Carbs are one of your brain's main sources of fuel.", type: "true", note: "Your brain runs largely on glucose, which comes from carbohydrates. Cutting them out entirely doesn't help your brain function better." },
  { text: "Detox teas flush toxins out of your body.", type: "myth", note: "Your liver and kidneys already filter your blood around the clock. No tea speeds that up — most \"detox\" effects are just mild laxative or diuretic action." },
  { text: "Pairing iron-rich food with vitamin C helps your body absorb more iron.", type: "true", note: "This one's real. Vitamin C helps convert iron into a form your body can absorb more easily — think steak with a side of bell peppers." },
  { text: "You should avoid eating carbs after 6pm if you want to lose weight.", type: "myth", note: "Your body doesn't have an internal clock that turns carbs into fat after a certain hour. Total intake and overall pattern matter far more than timing." },
  { text: "Protein helps your body build and repair muscle tissue.", type: "true", note: "True — protein is the raw material your body uses to build and repair tissue, which matters even more while you're still growing." },
  { text: "Cutting all fat out of your diet is the healthiest option.", type: "myth", note: "Dietary fat helps you absorb certain vitamins and supplies fatty acids your body can't make on its own. Zero fat isn't a health upgrade." },
  { text: "Teens generally need more sleep than adults.", type: "true", note: "Teens are recommended 8–10 hours a night — more than most adults need — because of how much growth and development is happening." },
  { text: "Celery has \"negative calories\" because chewing and digesting it burns more energy than it contains.", type: "myth", note: "Digesting any food takes a small amount of energy, but nowhere close to canceling out its calories. This one's a popular myth, not biology." },
  { text: "Skipping meals can make you hungrier later and more likely to overeat.", type: "true", note: "When you skip meals, your body doesn't just \"forget\" to be hungry — it usually catches up hard later, which can make it harder to listen to normal hunger cues." },
  { text: "Supplements are tested and regulated as strictly as prescription medications.", type: "myth", note: "In the U.S., supplements don't have to prove they're effective before hitting shelves the way medications do. \"Natural\" and \"regulated the same as medicine\" aren't the same thing — more on this in the next article." }
];

let shuffled = [...claims].sort(() => Math.random() - 0.5);
let current = 0;
let score = 0;
let streak = 0;
let answered = false;

function loadQuestion() {
  const q = shuffled[current];
  document.getElementById('claim-text').textContent = q.text;
  document.getElementById('progress-label').textContent = `Claim ${current + 1} of ${shuffled.length}`;
  document.getElementById('progress-fill').style.width = `${((current + 1) / shuffled.length) * 100}%`;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  document.getElementById('btn-true').className = 'btn btn-true';
  document.getElementById('btn-myth').className = 'btn btn-myth';
  document.getElementById('btn-true').disabled = false;
  document.getElementById('btn-myth').disabled = false;
  answered = false;
}

function answer(choice) {
  if (answered) return;
  answered = true;
  const q = shuffled[current];
  const correct = choice === q.type;

  document.getElementById('btn-true').disabled = true;
  document.getElementById('btn-myth').disabled = true;

  const chosenBtn = document.getElementById(choice === 'true' ? 'btn-true' : 'btn-myth');

  if (correct) {
    chosenBtn.classList.add('selected-correct');
    score++;
    streak++;
  } else {
    chosenBtn.classList.add('selected-incorrect');
    const correctBtn = document.getElementById(q.type === 'true' ? 'btn-true' : 'btn-myth');
    correctBtn.classList.add('reveal-correct');
    streak = 0;
  }

  document.getElementById('streak-label').textContent = `🔥 ${streak}`;

  const fb = document.getElementById('feedback');
  fb.className = `feedback show ${correct ? 'correct' : 'incorrect'}`;
  fb.innerHTML = `<strong>${correct ? "Nailed it." : "Good guess, but no."}</strong>${q.note}`;

  document.getElementById('next-btn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < shuffled.length) {
    loadQuestion();
  } else {
    showEnd();
  }
}

function showEnd() {
  const card = document.getElementById('game-card');
  let msg, kyleImg, kyleCaption;
  if (score >= 7) {
    kyleImg = 'kyle-huzzah.png';
    kyleCaption = '"Huzzah." — Kyle';
    msg = score === shuffled.length ? "You've got a solid nose for spotting nonsense. Keep that instinct — you'll need it." : "Pretty sharp. A little healthy skepticism goes a long way online.";
  } else if (score === 6) {
    kyleImg = 'kyle-revisit.png';
    kyleCaption = '"We shall revisit this." — Kyle';
    msg = "So close! A little more practice spotting the fakes and you've got it.";
  } else {
    kyleImg = 'kyle-ohdear.png';
    kyleCaption = '"Oh, dear." — Kyle';
    msg = "This stuff is genuinely tricky — even smart people get fooled by confident-sounding claims. That's exactly why it's worth practicing.";
  }

  card.innerHTML = `
    <div class="end-screen">
      <img class="kyle-img" src="${kyleImg}" alt="Kyle the tortoise reacting to your score">
      <div class="kyle-caption">${kyleCaption}</div>
      <div class="end-title">${score} / ${shuffled.length}</div>
      <div class="end-score">${msg}</div>
      <button class="restart-btn" onclick="restart()">Play Again</button>
    </div>
  `;
}

function restart() {
  location.reload();
}

loadQuestion();
</script>

</body>
</html>
